<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>광세기 플레이샵 🎒</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#FFF8F1;--card:#FFFFFF;--ink:#2B2A33;--ink2:#5E5B6B;--muted:#9A96A6;--line:#F0E6DA;
  --peach:#FF9F7A;--peach-soft:#FFE5D9;--mint:#5CC9A7;--mint-soft:#DDF5EC;--sky:#6AA8FF;--sky-soft:#E3EEFF;
  --lemon:#FFD15C;--lemon-soft:#FFF4D1;--grape:#A88BFF;--grape-soft:#EEE7FF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 60px}
header{padding:36px 0 18px;text-align:center}
header .badge{display:inline-block;background:var(--lemon-soft);color:#9A6B00;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
header h1{font-size:30px;margin:12px 0 6px;letter-spacing:-.5px}
header p{color:var(--ink2);margin:0}
.timeline{display:flex;gap:8px;overflow-x:auto;padding:18px 2px 6px;scroll-snap-type:x mandatory}
.step{flex:0 0 auto;scroll-snap-align:start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;min-width:132px;text-align:center}
.step .em{font-size:24px}.step .t{font-size:12px;color:var(--muted)}.step .n{font-weight:700;font-size:14px}
.step.fixed{background:var(--mint-soft);border-color:#BFE9DA}
.step.vote{background:var(--peach-soft);border-color:#FFD0BD}
.step .pick{font-size:12px;color:var(--ink2);margin-top:2px}
.arrow{flex:0 0 auto;align-self:center;color:var(--muted)}
.me{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:14px 16px;margin:16px 0;border:2px dashed var(--line)}
.me input{flex:1 1 180px;font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:12px;outline:none}
.me input:focus{border-color:var(--peach)}
.me .hint{width:100%;font-size:12.5px;color:var(--muted)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--peach);color:#fff}
.btn.ghost{background:transparent;color:var(--ink2);border:2px solid var(--line)}
.notice{background:var(--lemon-soft);border-radius:14px;padding:10px 14px;font-size:13px;color:#7A5A00;margin:10px 0}
section.stage{margin:28px 0}
.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sh h2{margin:0;font-size:21px}.sh .time{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cand{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.cand:hover{transform:translateY(-2px)}
.cand.mine{border-color:var(--peach);box-shadow:0 6px 18px rgba(255,159,122,.18)}
.cand .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cand .nm{font-weight:800;font-size:16.5px}
.cand .cat{font-size:12px;color:var(--ink2);background:var(--sky-soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.cand .rate{font-size:13px;color:var(--ink2)}.cand .rate b{color:#E08A00}
.cand .ph{width:100%;height:120px;object-fit:cover;border-radius:12px;background:#F3ECE4;margin:-2px 0 2px;display:block}
.cand .note{font-size:12.5px;color:#7A5A00;background:var(--lemon-soft);border-radius:10px;padding:4px 9px;align-self:flex-start}
.cand .menu{font-size:13px;color:var(--ink2)}
.cand .dopen{font-size:13.5px;font-weight:800;color:#C4542A;background:var(--peach-soft);border-radius:10px;padding:4px 9px;align-self:flex-start}
.cand .closed{color:#E03131;font-weight:800;font-size:15px}
.cand .warn{color:#D9480F;font-weight:700}
.seq{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-weight:700;font-size:14px}
.seq span{background:var(--sky-soft);border-radius:999px;padding:3px 9px}.seq span.hk{background:var(--mint-soft)}.seq i{font-style:normal;color:var(--muted)}
.cand .rv{font-size:13.5px;color:var(--ink2);background:#FBF7F2;border-radius:12px;padding:8px 10px}
.cand .meta{font-size:12.5px;color:var(--muted)}
.cand .row{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
.cand .row a{font-size:12.5px;color:var(--sky);text-decoration:none;font-weight:600}
.vote{margin-left:auto;font:inherit;font-weight:800;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;background:var(--peach-soft);color:#C4542A}
.cand.mine .vote{background:var(--peach);color:#fff}
.bar{height:10px;background:#F5EEE6;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--lemon));border-radius:999px;transition:width .3s}
.who{font-size:12px;color:var(--muted);min-height:16px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:26px;text-align:center;color:var(--muted)}
.result{background:var(--card);border-radius:20px;padding:18px;border:2px solid var(--line)}
.result h2{margin:0 0 10px;font-size:20px}
.res-row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.res-row:last-child{border-bottom:0}
.res-row .lb{font-weight:700}.res-row .cnt{color:var(--muted);font-size:13px}
.reco{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:6px 0 12px}
.reco h3{margin:0 0 6px;font-size:16px}.reco .best{background:var(--mint-soft);border-radius:12px;padding:10px 12px;margin:6px 0}
.reco table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.reco th,.reco td{text-align:left;padding:6px 4px;border-bottom:1px dashed var(--line)}
.reco td.n{text-align:right;white-space:nowrap}.reco .warn{color:#D9480F}.reco .cap{color:var(--muted);font-size:12px;margin-top:6px}
.pin{background:#fff;border:2px solid #FF9F7A;border-radius:999px;padding:3px 9px;font:700 12px Pretendard,sans-serif;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.pin.hk{border-color:#5CC9A7}
.maptools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--grape-soft);border-color:var(--grape);color:#5B3FD6}
#map{width:100%;height:380px;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#EFEAF8}
.nomap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink2);gap:6px;padding:20px;text-align:center}
.legs{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.legs li{background:var(--card);border-radius:14px;padding:9px 12px;border:2px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legs .no{background:var(--grape);color:#fff;border-radius:999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.legs a{margin-left:auto;font-size:12.5px;color:var(--sky);font-weight:700;text-decoration:none}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:520px){header h1{font-size:25px}#map{height:300px}.res-row{grid-template-columns:70px 1fr}.res-row .cnt{grid-column:2}}
</style>
</head>

  <div class="me">

  </div>
  <div class="notice" id="modeNote" hidden></div>

  <div id="stages"></div>

  <section class="stage">
    <div class="result" id="result"></div>

    <div class="reco" id="reco"></div>
    <div id="map"></div>
    <ul class="legs" id="legs"></ul>

</div>

const PLACE=STAGES.filter(s=>s.id!=='order');

/* ===== 투표 저장소 ===== */
const LS='playshop-2026-votes', LSN='playshop-2026-name';
const store={
  async load(){
    if(CONFIG.voteApi){const r=await fetch(CONFIG.voteApi+'?action=get&t='+Date.now());return (await r.json()).votes||{}}
    try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}
  },
  async vote(stage,voter,cand){
    if(CONFIG.voteApi){const q=new URLSearchParams({action:'vote',stage,voter,cand});const r=await fetch(CONFIG.voteApi+'?'+q);return (await r.json()).votes||{}}
    const v=await store.load();v[stage]=v[stage]||{};if(cand)v[stage][voter]=cand;else delete v[stage][voter];
    try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}return v;
  }
};

/* ===== 상태 ===== */
let VOTES={}, ME='', ROUTE='top';
try{ME=localStorage.getItem(LSN)||''}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1600)};
const tally=st=>{const c={};Object.values(VOTES[st.id]||{}).forEach(id=>c[id]=(c[id]||0)+1);return c};
const votersOf=(st,id)=>Object.entries(VOTES[st.id]||{}).filter(([,c])=>c===id).map(([n])=>n);
const leader=st=>{const c=tally(st);let best=null;st.cands.forEach(x=>{if((c[x.id]||0)>0&&(!best||c[x.id]>c[best.id]))best=x});return best};
const myPick=st=>{const id=(VOTES[st.id]||{})[ME];return st.cands.find(x=>x.id===id)};

$('#myName').value=ME;
$('#saveName').onclick=()=>{const v=$('#myName').value.trim();if(!v)return toast('이름을 적어주세요 🙂');ME=v;try{localStorage.setItem(LSN,v)}catch(e){}toast(`반가워요, ${v}님! 👋`);render()};
if(!CONFIG.voteApi){$('#modeNote').hidden=false;$('#modeNote').textContent='🛠 지금은 미리보기 모드라 투표가 이 기기에만 저장돼요. 투표 저장소를 연결하면 모두의 투표가 모여요.'}

function render(){
  // stages
  $('#stages').innerHTML=STAGES.map(st=>{
    const c=tally(st),tot=Object.values(c).reduce((a,b)=>a+b,0),mine=myPick(st);
    const body=st.cands.length?`<div class="cards">${st.cands.map(x=>{const n=c[x.id]||0,w=tot?n/tot*100:0,vs=votersOf(st,x.id);
      return `<div class="cand ${mine&&mine.id===x.id?'mine':''}">
        ${x.photo?`<img class="ph" src="${esc(x.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
        ${st.id==='order'?`<div class="seq">${x.seq.map(s=>`<span class="${s==='hike'?'hk':''}">${STEP[s].emoji} ${STEP[s].title}</span>`).join('<i>→</i>')}</div>`:`<div class="top"><div class="nm">${esc(x.name)}</div>${x.cat?`<span class="cat">${esc(x.cat)}</span>`:''}</div>`}
        ${x.hours&&x.hours.includes('휴무')?`<div class="closed">수요일 휴무</div>`:''}
        ${x.note?`<div class="note">📌 ${esc(x.note)}</div>`:''}
        ${st.id==='order'?'':`<div class="rate">${x.rating?`⭐ <b>${x.rating}</b>${x.reviews?` · 리뷰 ${x.reviews}`:''}`:'⭐ 카카오맵 평점 없음'}${x.hours?` · <span class="${x.hours.startsWith('⚠️')?'warn':''}">${esc(x.hours)}</span>`:''}</div>`}
        ${x.brk||x.lo?`<div class="menu">⏸️ ${x.brk?`브레이크타임 ${esc(x.brk)}`:''}${x.brk&&x.lo?' · ':''}${x.lo?`라스트오더 ${esc(x.lo)}`:''}</div>`:''}
        ${st.id==='dinner'&&x.hours&&!x.hours.includes('휴무')?`<div class="dopen">🕔 ${x.brk?'저녁 영업 시작':'영업 시작'} ${esc(x.brk?x.brk.split(' · ').pop().split('~')[1].trim():x.hours.replace('수 ','').split(' ~')[0])}</div>`:''}
        ${x.menu?`<div class="menu">🍽️ ${esc(x.menu)}</div>`:''}
        ${x.review?`<div class="rv">💬 ${esc(x.review)}</div>`:''}
        ${x.addr||x.note?`<div class="meta">${esc(x.addr||'')}${x.addr&&x.note?' · ':''}${esc(x.note||'')}</div>`:''}
        <div class="bar"><i style="width:${w}%"></i></div>
        <div class="who">${n?`${n}표 · ${vs.map(esc).join(', ')}`:'아직 0표'}</div>
        <div class="row">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${x.url.includes('kakao')?'카카오맵에서 보기':'블로그에서 보기'} ↗</a>`:''}<button class="vote" data-s="${st.id}" data-c="${x.id}">${mine&&mine.id===x.id?'✔ 내 픽':'여기 갈래요'}</button></div>
      </div>`}).join('')}</div>`:`<div class="empty">후보를 준비하고 있어요 👀</div>`;
    return `<section class="stage"><div class="sh"><h2>${st.emoji} ${st.title}</h2><span class="time">${st.time} · ${tot}명 참여</span></div>${body}</section>`;
  }).join('');
  document.querySelectorAll('.vote').forEach(b=>b.onclick=async()=>{
    if(!ME){$('#myName').focus();return toast('먼저 이름을 저장해 주세요 🙋')}
    const st=STAGES.find(s=>s.id===b.dataset.s),cur=(VOTES[st.id]||{})[ME],next=cur===b.dataset.c?'':b.dataset.c;
    b.disabled=true;try{VOTES=await store.vote(st.id,ME,next);toast(next?'투표 완료! 🗳️':'투표를 취소했어요')}catch(e){toast('저장에 실패했어요. 다시 눌러주세요')}render();
  });
  // result
  $('#result').innerHTML=`<h2>🏆 지금까지 결과</h2>`+STAGES.map(st=>{const l=leader(st),c=tally(st);
    const ties=l?st.cands.filter(x=>(c[x.id]||0)===c[l.id]):[];
    return `<div class="res-row"><span class="lb">${st.emoji} ${st.title}</span><span>${l?ties.map(t=>esc(t.name)).join(' · ')+(ties.length>1?' (동점)':''):'<span style="color:var(--muted)">아직 투표 전</span>'}</span><span class="cnt">${l?c[l.id]+'표':''}</span></div>`}).join('');
  // route
  $('#routeMode').innerHTML=[['top','🏆 1위 동선'],['mine','🙋 내 픽 동선']].map(([k,l])=>`<button class="chip ${ROUTE===k?'on':''}" data-r="${k}">${l}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ROUTE=b.dataset.r;render()});
  drawRoute();
}

/* ===== 지도 ===== */
let MAP=null,OVL=[];
const kmLink=(a,b)=>`https://map.kakao.com/link/from/${encodeURIComponent(a.name)},${a.y},${a.x}/to/${encodeURIComponent(b.name)},${b.y},${b.x}`;
const dist=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.y-a.y)*r,dn=(b.x-a.x)*r,q=Math.sin(dl/2)**2+Math.cos(a.y*r)*Math.cos(b.y*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))*1.3};
const legTxt=km=>km<=1.5?`도보 약 ${Math.max(1,Math.round(km/4*60))}분`:`택시 약 ${Math.round(km/20*60+5)}분`;
const openAt=h=>{const m=(h||'').match(/(\d{2}):(\d{2})\s*~/);return m?+m[1]+m[2]/60:null};
function pickFor(s){if(s==='hike')return {...START,stage:{emoji:'⛰️',title:'남산 트래킹'}};const st=STAGES.find(x=>x.id===s);const p=ROUTE==='mine'?myPick(st):leader(st);return p&&p.x?{...p,stage:st}:null}
function evalOrder(o){const pts=o.seq.map(pickFor).filter(Boolean);let km=0;const legs=[];for(let i=1;i<pts.length;i++){const d=dist(pts[i-1],pts[i]);km+=d;legs.push([pts[i-1],pts[i],d])}
  const warn=[];if(o.seq[0]==='cafe'){const c=pickFor('cafe');if(c){const h=openAt(c.hours);if(c.hours&&c.hours.includes('휴무'))warn.push(`${c.name} 수요일 휴무`);else if(h!=null&&h>10)warn.push(`${c.name} ${c.hours.replace('수 ','').split(' ~')[0]} 오픈이라 11시 집결 전 커피 불가`)}}
  const l=pickFor('lunch');if(l&&o.seq.indexOf('lunch')<o.seq.indexOf('hike')){const h=openAt(l.hours);if(h!=null&&h>10.5)warn.push(`${l.name} ${l.hours.replace('수 ','').split(' ~')[0]} 오픈이라 등산 전 점심이 빠듯함`)}
  return {o,pts,legs,km,warn}}
function bestOrder(){const R=ORDERS.map(evalOrder),ok=R.filter(r=>!r.warn.length);return {R,best:(ok.length?ok:R).slice().sort((a,b)=>a.km-b.km)[0]}}
const routePts=()=>bestOrder().best.pts;
function drawReco(){
  const {R,best}=bestOrder(),known=R[0].pts.length;
  if(known<3){$('#reco').innerHTML=`<h3>🧭 추천 동선</h3><div class="cap">${ROUTE==='mine'?'내 픽':'투표'}이 2곳 이상 정해지면 일정 순서별 이동거리를 비교해 추천해 드려요</div>`;return}
  $('#reco').innerHTML=`<h3>🧭 추천 동선 <span style="font-weight:400;color:var(--muted);font-size:12.5px">(${ROUTE==='mine'?'내 픽':'현재 1위'} 장소 기준)</span></h3>
  <div class="best">👉 <b>${esc(best.o.name)}</b> · 총 이동 약 ${best.km.toFixed(1)}km<br>${best.legs.map(([a,b,d])=>`${esc(a.name)} → ${esc(b.name)} (${d.toFixed(1)}km, ${legTxt(d)})`).join('<br>')}</div>
  <table><tr><th>일정 순서</th><th>총 이동</th><th>체크</th></tr>${R.map(r=>`<tr><td>${r===best?'⭐ ':''}${esc(r.o.name)}</td><td class="n">${r.km.toFixed(1)}km</td><td class="${r.warn.length?'warn':''}">${r.warn.length?r.warn.map(esc).join('<br>'):'✅'}</td></tr>`).join('')}</table>
  <div class="cap">직선거리×1.3으로 어림한 값 · 1.5km 이하는 도보, 넘으면 택시 기준 · 안 정해진 단계는 빼고 계산 · 11시 김유신장군상 집결 기준</div>`;
}
let LMAP=null,LLAYER=null;
function drawLeaflet(pts){
  if(!window.L){$('#map').innerHTML=`<div class="nomap"><div style="font-size:28px">🗺️</div><b>지도를 불러오지 못했어요</b></div>`;return}
  if(!LMAP){$('#map').innerHTML='';LMAP=L.map('map',{scrollWheelZoom:false}).setView([START.y,START.x],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(LMAP)}
  if(LLAYER)LLAYER.remove();LLAYER=L.layerGroup().addTo(LMAP);
  const ll=pts.map(p=>[p.y,p.x]);
  pts.forEach((p,i)=>L.marker([p.y,p.x],{icon:L.divIcon({className:'',html:`<div class="pin ${p.stage.title==='남산 트래킹'?'hk':''}">${i+1}. ${p.stage.emoji} ${esc(p.name)}</div>`,iconAnchor:[10,28]})}).addTo(LLAYER));
  pts.forEach(p=>L.circleMarker([p.y,p.x],{radius:6,color:'#fff',weight:2,fillColor:'#E03131',fillOpacity:1}).addTo(LLAYER));
  if(ll.length>1){L.polyline(ll,{color:'#E03131',weight:7,opacity:.9,dashArray:'10 8'}).addTo(LLAYER);LMAP.fitBounds(ll,{padding:[50,50]})}else LMAP.setView(ll[0],15);
}
function drawRoute(){
  drawReco();
  const pts=routePts();
  $('#legs').innerHTML=pts.length>1?pts.slice(1).map((p,i)=>`<li><span class="no">${i+1}</span>${esc(pts[i].name)} → <b>${esc(p.name)}</b> <span style="color:var(--muted);font-size:12.5px">${p.stage.emoji} ${p.stage.title}</span><a href="${kmLink(pts[i],p)}" target="_blank" rel="noopener">길찾기 ↗</a></li>`).join(''):`<li style="color:var(--muted)">${ROUTE==='mine'?'내가 고른 곳이 생기면':'투표가 모이면'} 동선이 그려져요</li>`;
  if(!window.kakao||!kakao.maps){drawLeaflet(pts);return}
  if(!MAP)MAP=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(START.y,START.x),level:6});
  OVL.forEach(o=>o.setMap(null));OVL=[];
  const bounds=new kakao.maps.LatLngBounds(),path=[];const hk=p=>p.stage.title==='남산 트래킹';
  pts.forEach((p,i)=>{const ll=new kakao.maps.LatLng(p.y,p.x);bounds.extend(ll);path.push(ll);
    const lab=`${p.stage.emoji} ${p.name}`;
    OVL.push(new kakao.maps.CustomOverlay({map:MAP,position:ll,yAnchor:1.3,content:`<div style="background:#fff;border:2px solid ${hk(p)?'#5CC9A7':'#FF9F7A'};border-radius:999px;padding:4px 10px;font:700 12.5px Pretendard,sans-serif;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)">${esc(lab)}</div>`}));
    OVL.push(new kakao.maps.Marker({map:MAP,position:ll}));
  });
  if(path.length>1)OVL.push(new kakao.maps.Polyline({map:MAP,path,strokeWeight:7,strokeColor:'#E03131',strokeOpacity:.85,strokeStyle:'shortdash'}));
  if(path.length>1)MAP.setBounds(bounds,60,60,60,60);else MAP.setCenter(path[0]);
}

/* ===== 시작 ===== */
async function boot(){
  try{VOTES=await store.load()}catch(e){VOTES={};toast('투표 불러오기에 실패했어요')}
  render();
  if(CONFIG.voteApi)setInterval(async()=>{try{VOTES=await store.load();render()}catch(e){}},15000);
}
if(CONFIG.kakaoJsKey){const s=document.createElement('script');s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.kakaoJsKey}&autoload=false`;s.onload=()=>kakao.maps.load(boot);s.onerror=boot;document.head.appendChild(s)}else boot();
</script>
</body>
</html>
